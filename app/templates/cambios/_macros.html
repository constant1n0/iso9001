{% macro estado_badge(estado) -%}
{%- set variante = {'propuesto': ' badge--warn', 'eficacia_revisada': ' badge--ok'} -%}
<span class="badge{{ variante.get(estado.name, '') }}">{{ estado.value }}</span>
{%- endmacro %}

{% macro tarea_badge(estado) -%}
{%- set variante = {'en_curso': ' badge--warn', 'completada': ' badge--ok'} -%}
<span class="badge{{ variante.get(estado.name, '') }}">{{ estado.value }}</span>
{%- endmacro %}

{% macro eficacia_badge(eficacia) -%}
{%- if eficacia %}<span class="badge{{ ' badge--ok' if eficacia.name == 'eficaz' else ' badge--danger' }}">{{ eficacia.value }}</span>{% else %}—{% endif -%}
{%- endmacro %}

{# The origin of a change and, below it, the record behind it (linked when the role reads it). #}
{% macro origen_de(cambio, registro) -%}
{{ cambio.origen.value }}{% if registro %}<br>{% if registro.url %}<a href="{{ registro.url }}">{{ registro.label }}</a>{% else %}<span class="muted">{{ registro.label }}</span>{% endif %}{% endif %}
{%- endmacro %}

{% macro dia(value) %}{{ value.strftime('%d/%m/%Y') if value else '—' }}{% endmacro %}
