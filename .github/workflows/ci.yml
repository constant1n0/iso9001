name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iso9001
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: iso9001_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iso9001 -d iso9001_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install WeasyPrint runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libharfbuzz-subset0

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run tests
        env:
          TEST_POSTGRES_URI: postgresql://iso9001:ci-only-password@localhost:5432/iso9001_test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
